# CI gate — the mechanical backstop.
#
# Copy to <repo>/.github/workflows/gate.yml, then uncomment the toolchain block for
# your stack. Keep exactly ONE toolchain active per repo. BOTH ship commented out:
# a file that arrives with one already active makes "uncomment yours" produce two,
# and CI then runs `yarn install` on a repo with no package.json.
#
# This runs the repository's own `gate.sh` — the same script the developer runs
# locally, so there is no separate CI command chain to drift out of sync
# (`docs/process/team-workflow.md` §3).
#
# WHY THIS MATTERS ON SOLO PROJECTS: the local gate is user-run and its receipt is
# local evidence. CI is the only check not run by the party being checked. On a
# team, peer review is a second line of defence; solo, this file is the only one.
#
# After adding this, turn on branch protection for `main` and mark the `gate` check
# as required — an unenforced check is decoration.
#
# ---------------------------------------------------------------------------
# WHAT THIS DOES AND DOES NOT GUARANTEE. Read this before trusting it.
#
# CI runs a script that lives in the repository, from the pull request's own head
# branch. So "CI is not run by the party being checked" holds for the *execution*
# and not for the *definition*: an agent that edits `gate.sh` to `true` and then
# runs it honestly produces a receipt that is genuine in every checkable respect
# and a green CI job, while the test suite still fails. This does not take malice
# — an agent whose lint step trips on pre-existing warnings, reading that the gate
# script is the only place gate commands are defined, may reasonably conclude that
# adjusting the gate is the sanctioned way to adjust the gate.
#
# The `Pin the gate` step below is what closes that. It does NOT make `gate.sh`
# unmodifiable — nothing in-repo can. What it does is make a modification
# *impossible to land silently*: changing the gate now requires changing
# `.gate-sha256` in the same pull request, which is a one-line diff a reviewer
# cannot miss and CODEOWNERS can require a specific human to approve.
#
# The same caveat applies to this workflow file: for same-repo `pull_request`
# events GitHub runs the workflow definition from the head branch, so a PR can
# weaken its own required check. Put `.github/workflows/` in CODEOWNERS too — see
# `tooling/ci/CODEOWNERS` — and require review from someone who is not the author.
# ---------------------------------------------------------------------------

name: gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the default single-commit checkout has no history, so
      # `git log -- docs/exceptions.md` returns nothing and the "was this file
      # deleted" test below silently passes forever. If full history is too
      # expensive on this repo, drop it and delete that test rather than shipping a
      # check that cannot fail.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fail closed. A missing pin file is indistinguishable from a deleted one,
      # so treat it as a failure rather than skipping the check — the whole point
      # is that weakening the gate cannot be done quietly.
      #
      # `sha256sum -c` verifies the lines it is GIVEN. It says nothing about the
      # lines it is not given, so a pin file that names some other file passes
      # with `README.md: OK` and rc=0 while gate.sh sits unpinned:
      #
      #     echo 'exit 0' > gate.sh
      #     sha256sum README.md > .gate-sha256
      #     sha256sum -c .gate-sha256      # README.md: OK, rc=0
      #
      # That is not a theoretical hole. The install guard's perimeter block
      # deliberately does NOT protect gate.sh, .gate-sha256, check-stubs.* or
      # .gate-stubs-baseline, on the stated grounds that they are "pinned by CI
      # and owned in CODEOWNERS" — so the delegation has to be real. Asserting
      # that the pin NAMES its subjects is what makes it real.
      #
      # The stub ratchet is in the list for the same reason: `echo 9999 >
      # .gate-stubs-baseline` turns the ratchet off and the script then prints
      # "improved" and exits 0, congratulating you for disabling it.
      #
      # To change the gate legitimately: edit gate.sh, then regenerate the pin in
      # the SAME commit with the command in the message below, and say in the PR
      # description why the gate changed.
      - name: Pin the gate
        env:
          # Every file whose contents decide what "the gate passed" means. Add
          # gate.ps1 here too if your team runs the PowerShell gate.
          PINNED: gate.sh check-stubs.sh .gate-stubs-baseline
        run: |
          if [ ! -f .gate-sha256 ]; then
            echo "MISSING: .gate-sha256 — the gate script is unpinned, so a change to"
            echo "  gate.sh would land without anyone having to acknowledge it."
            echo "  Create it with:  sha256sum $PINNED > .gate-sha256"
            exit 1
          fi
          missing=""
          for f in $PINNED; do
            # `$2` is the filename column of sha256sum output; a leading `*`
            # means the hash was taken in binary mode.
            awk -v want="$f" '{ sub(/^\*/, "", $2); if ($2 == want) found = 1 }
                              END { exit found ? 0 : 1 }' .gate-sha256 || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "UNPINNED: .gate-sha256 does not name:$missing"
            echo '  A pin only covers the lines it contains. sha256sum -c reports OK'
            echo "  for a file list that omits the gate entirely. Regenerate it with:"
            echo "    sha256sum $PINNED > .gate-sha256"
            exit 1
          fi
          if ! sha256sum -c .gate-sha256; then
            echo
            echo "CHANGED: a pinned file does not match .gate-sha256."
            echo "  If this change is intended, regenerate the pin in this same PR:"
            echo "    sha256sum $PINNED > .gate-sha256"
            echo "  and say in the PR description what the gate now does differently."
            echo "  If it is not intended, the gate has been weakened — find out by whom."
            exit 1
          fi

      # The package guard is disabled for as long as this marker exists. It is
      # meant to be created by a human, used for one approved change, and deleted
      # when the phase commits. Committing it makes that "temporarily open" state
      # permanent and shared — and /framework-doctor, which finds the residue, runs
      # after setup and after upgrade, never during phase work.
      - name: The package-guard override must not be committed
        run: |
          if git ls-files --error-unmatch .claude/allow-package-changes >/dev/null 2>&1; then
            echo "COMMITTED: .claude/allow-package-changes is tracked in git."
            echo "  While it exists the package guard permits every manifest edit and"
            echo "  every install command, for everyone who clones this repo."
            echo "  Remove it:  git rm --cached .claude/allow-package-changes"
            echo "  and add it to .gitignore."
            exit 1
          fi

      # --- toolchain: uncomment exactly ONE of these ---------------------------
      # Node / Next.js:
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'
      # - name: Install dependencies
      #   run: corepack enable && yarn install --immutable

      # .NET:
      # - uses: actions/setup-dotnet@v4
      #   with:
      #     dotnet-version: '8.0.x'
      # - name: Restore
      #   run: dotnet restore
      # -----------------------------------------------------------------------

      # Nothing else in the framework requires the implementation to be REAL. A
      # phase can persist a value, leave the block holding the feature's core
      # invariant empty behind a TODO, write tests that assert a status code and
      # the presence of a field, pass the build, earn a GENUINE valid receipt, tick
      # every review box, and reach "Done pending human review".
      #
      # A ratchet rather than a threshold: brownfield repos legitimately start with
      # hundreds of markers, and demanding zero would be ignored within a week.
      # What it forbids is the number going up. `approved-stub: <where the spec
      # defers it>` on the line exempts a deliberate placeholder, so a deferral is
      # declared and reviewable instead of invisible.
      - name: Stub ratchet
        run: |
          chmod +x ./check-stubs.sh
          ./check-stubs.sh

      # An exception path with no cost is just the process, and gets used for
      # convenience within a month. This charges the debt to whoever tries to move
      # NEXT rather than to whoever incurred it, which is the only pressure that
      # reliably beats the pressure that created the exception in the first place.
      # Struck-through rows are closed and ignored. No exceptions file is fine.
      #
      # ONE awk pass, deliberately. The first version piped through a `while` loop,
      # and a `while` returns the status of the last command in its body: when the
      # last date scanned was NOT overdue the `&&` list returned 1, so the pipeline
      # returned 1, so the command substitution returned 1, and GitHub's default
      # `bash -e` killed the step before the `if` was ever evaluated. A single
      # legitimate open exception with a future date therefore failed every PR, with
      # no output at all — and a genuinely overdue row that was not the LAST row
      # exited 1 without ever printing the OVERDUE message or its guidance. The file
      # promises CI fails "while an open exception is past its remediation date"; it
      # was wrong in both directions, and the predictable outcome of a step that
      # fails silently and inexplicably is that someone deletes it.
      #
      # The remediation column is found by its HEADER, not by position. Anchoring to
      # the last cell silently disabled the check for every row the moment anyone
      # appended a Status column -- the most likely way a human-maintained table
      # evolves. Scanning every cell instead is worse, not better: the FIRST column
      # of this table is the date the exception was opened, which is in the past by
      # definition, so it would report every open exception as overdue.
      #
      # Four things the first header-bound version got wrong, all of which made the
      # check pass silently -- the failure mode this whole file exists to argue
      # against -- and all of which are now hard failures instead:
      #
      #   1. The header was matched with `h ~ /remediate|remediation|dueby/`, so a
      #      column called "Remediation notes" earlier in the table won and the real
      #      deadline column was never read. exceptions.md invites adding and
      #      reordering columns, which is precisely that edit. The match is now
      #      EXACT, and two matching headers in one table are an error rather than
      #      a coin toss.
      #   2. `col` was bound once per FILE and never reset, so a second table with
      #      different columns was read with the first table's index. It is now
      #      re-bound per table -- a table is a maximal run of lines starting `|`.
      #   3. A row with a missing cell (or a stray `|` inside a Why cell -- the most
      #      likely typo in a hand-maintained table) shifted the date out of `$col`
      #      and the row was silently skipped. A row whose cell count does not match
      #      its header is now a FAILURE.
      #   4. The date was shape-checked by regex and compared as a string, so
      #      `2026-13-45` bought five months of silence and `9999-99-99` bought
      #      forever. Month and day are now range-checked, leap years included.
      #
      # The strikethrough test is scoped to the first cell: `grep -v '~~'` dropped a
      # row if `~~` appeared ANYWHERE in it, so `~~cancelled~~ prod incident` in the
      # Why cell closed a row that was still open.
      #
      # A file with no table at all is FINE, and used to be a hard failure with a
      # message that misdescribed the problem: a team that closed its last exception
      # by deleting the rows got "MALFORMED: no 'Remediate by' column" on every PR,
      # could not empty the file and could not delete it either.
      - name: No overdue exceptions
        run: |
          f=docs/exceptions.md
          if [ ! -f "$f" ]; then
            # Deleting the file erases every open exception and its deadline, and
            # the check above would then pass instantly. Closed exceptions are
            # struck through, not removed — the history is the point.
            if [ -n "$(git log --oneline -1 -- "$f" 2>/dev/null)" ]; then
              echo "DELETED: $f existed in this repository's history and is gone."
              echo "  Close exceptions by striking the row through, not by deleting"
              echo "  the file: a deleted file passes this check with no open rows."
              exit 1
            fi
            exit 0
          fi
          today=$(date -u +%Y-%m-%d)
          # `|| st=$?` and not a bare assignment: a command substitution that exits
          # non-zero fails the assignment, and under `bash -e` that kills the step
          # before anything below runs. That is the bug this rewrite exists to fix;
          # do not simplify it back.
          #
          # Exit codes out of the awk: 0 fine (overdue rows, if any, on stdout),
          # 3 no table in the file carries a deadline column, 4 one table carries
          # two, 5 a row could not be read. 3/4/5 all print their detail on stdout.
          st=0
          # EXCEPTIONS-AWK-BEGIN
          # tests/exceptions-check.sh extracts these lines and runs them against a
          # table of cases, so the shipped program is what the tests exercise. Keep
          # the markers, and keep everything between them free of `${{ }}`.
          out=$(awk -v t="$today" -F'|' '
            function trim(s) { gsub(/^[ \t\r]+|[ \t\r]+$/, "", s); return s }
            function realdate(d,   y, mo, da, dim) {
              if (d !~ /^[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$/) return 0
              y = substr(d, 1, 4) + 0; mo = substr(d, 6, 2) + 0; da = substr(d, 9, 2) + 0
              if (y < 1970 || y > 2999 || mo < 1 || mo > 12 || da < 1) return 0
              dim = 31
              if (mo == 4 || mo == 6 || mo == 9 || mo == 11) dim = 30
              else if (mo == 2) dim = (y % 4 == 0 && (y % 100 != 0 || y % 400 == 0)) ? 29 : 28
              return da <= dim
            }
            !/^[[:space:]]*\|/ { intable = 0; col = 0; hdr = 0; next }
            {
              rows++
              if (!intable) {
                intable = 1; hdr = NF; col = 0
                for (i = 2; i <= NF; i++) {
                  h = tolower($i); gsub(/[^a-z]/, "", h)
                  if (h == "remediateby" || h == "dueby") {
                    if (col) {
                      print "  line " NR ": two deadline columns in one table"
                      # A flag, not a bare `exit 4`: `exit` runs END, and END has
                      # its own `exit`, which would overwrite this status with 3.
                      dup = 1; exit
                    }
                    col = i
                  }
                }
                if (col) bound = 1
                next
              }
              if (col == 0) next
              sep = 1; dashes = 0
              for (i = 2; i <= NF; i++) {
                c = trim($i)
                if (c == "") continue
                if (c ~ /^:?-+:?$/) dashes++; else { sep = 0; break }
              }
              if (sep && dashes) next
              if (NF != hdr) {
                print "  line " NR ": this row is not the same width as its header,"
                print "           so which cell holds the deadline cannot be decided:"
                print "           " $0
                shape = 1; next
              }
              if (trim($2) ~ /~~/) next
              c = trim($col); gsub(/^[*_`~]+|[*_`~]+$/, "", c); c = trim(c)
              if (!realdate(c)) {
                print "  line " NR ": deadline is \"" trim($col) "\", which is not a real date"
                shape = 1; next
              }
              if (c < t) over = over "  " $0 "\n"
            }
            END {
              if (dup) exit 4
              if (rows == 0) exit 0
              if (!bound) exit 3
              if (shape) exit 5
              printf "%s", over
            }' "$f") || st=$?
          # EXCEPTIONS-AWK-END
          case "$st" in
            0) ;;
            3) echo "MALFORMED: no table in $f has a 'Remediate by' column."
               echo "  That column is what this check reads; without it no exception has"
               echo "  a deadline and this step would pass no matter what the table says."
               echo "  A file with no table at all is fine — this is a table whose header"
               echo "  is missing, misspelled, or written below its own data rows."
               echo "  See docs/process/exceptions.md for the table format."
               exit 1 ;;
            4) echo "MALFORMED: $f has two deadline columns in one table."
               echo "  Which one is binding cannot be decided, and guessing is how a"
               echo "  check starts reading the wrong cell. Keep one."
               printf '%s\n' "$out"
               exit 1 ;;
            5) echo "MALFORMED: $f has rows this check cannot read."
               echo "  A row whose cell count differs from its header, or whose deadline"
               echo "  is not a real calendar date, is not skipped — skipping it is how an"
               echo "  exception outlives its deadline with nobody noticing."
               printf '%s\n' "$out"
               exit 1 ;;
            *) echo "MALFORMED: reading $f failed with status $st."
               printf '%s\n' "$out"
               exit 1 ;;
          esac
          if [ -n "$out" ]; then
            echo "OVERDUE: an open exception is past its remediation date."
            echo "  Remediate it or move the date with a named authoriser — see"
            echo "  docs/process/exceptions.md. This blocks every PR until it is closed,"
            echo "  which is the point: the cost lands on whoever moves next."
            echo
            printf '%s\n' "$out"
            exit 1
          fi

      # A PreToolUse hook that is misconfigured fails OPEN: Claude Code treats an
      # unrunnable command as a hook ERROR, not a block, so the guard silently stops
      # guarding and the only thing that says so is this script. It was shipped, and
      # /framework-doctor ran it, but nothing ran it on a clean checkout — which is
      # the one place the answer is not produced by the party being checked.
      - name: The package guards actually block
        run: |
          if [ ! -f .claude/hooks/verify-guard.sh ]; then
            echo "MISSING: .claude/hooks/verify-guard.sh — the guards are unverified."
            echo "  Reinstall the hooks (SETUP.md step 5) or delete this step rather"
            echo "  than shipping a check that cannot fail."
            exit 1
          fi
          sh .claude/hooks/verify-guard.sh

      - name: Run the gate
        run: |
          chmod +x ./gate.sh
          ./gate.sh
        # gate.sh prints `EXIT: <code>` and exits with it, so a non-zero gate fails
        # the job. Do not add `continue-on-error` — that turns the gate into a
        # notification, and the framework's whole premise is that it is a gate.
